<!DOCTYPE html>
<html lang="am" data-theme="parchment">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>የሐዲስ ኪዳን አንድምታ ትርጓሜ — Ethiopian Orthodox New Testament Commentary</title>
  <meta name="description" content="Complete 13-Book Open-Source Edition of the Ethiopian Orthodox Tewahedo New Testament Ge'ez and Amharic Andemta Commentary." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM — QUIET LUXURY & SACRED BIRANNA TYPOGRAPHY
       ========================================================================== */
    :root, [data-theme="parchment"] {
      --bg-canvas: #f5f0e6;
      --bg-page: #faf7f0;
      --bg-sidebar: #efe9dc;
      --bg-surface: #ffffff;
      --bg-hover: rgba(28, 23, 18, 0.045);
      --bg-active: rgba(158, 27, 27, 0.08);
      --border-hairline: #e2d9c8;
      --border-subtle: #d4c8b2;
      --ink-black: #1c1712;
      --ink-secondary: #5a5043;
      --ink-muted: #8a7e6d;
      --ink-red: #9e1b1b;
      --ink-red-soft: rgba(158, 27, 27, 0.1);
      --accent-gold: #9a7426;
      --shadow-page: 0 1px 2px rgba(28, 23, 18, 0.04), 0 12px 36px -8px rgba(28, 23, 18, 0.07);
      --shadow-float: 0 10px 30px -5px rgba(28, 23, 18, 0.16), 0 2px 8px rgba(28, 23, 18, 0.06);
    }

    [data-theme="paper"] {
      --bg-canvas: #f3f4f6;
      --bg-page: #ffffff;
      --bg-sidebar: #f9fafb;
      --bg-surface: #ffffff;
      --bg-hover: rgba(17, 24, 39, 0.04);
      --bg-active: rgba(168, 24, 24, 0.07);
      --border-hairline: #e5e7eb;
      --border-subtle: #d1d5db;
      --ink-black: #111827;
      --ink-secondary: #4b5563;
      --ink-muted: #6b7280;
      --ink-red: #a81818;
      --ink-red-soft: rgba(168, 24, 24, 0.08);
      --accent-gold: #92400e;
      --shadow-page: 0 1px 3px rgba(0, 0, 0, 0.05), 0 10px 30px -10px rgba(0, 0, 0, 0.06);
      --shadow-float: 0 12px 32px -4px rgba(0, 0, 0, 0.12);
    }

    [data-theme="night"] {
      --bg-canvas: #0f0d0b;
      --bg-page: #161411;
      --bg-sidebar: #12100d;
      --bg-surface: #1e1b17;
      --bg-hover: rgba(255, 255, 255, 0.04);
      --bg-active: rgba(239, 95, 95, 0.14);
      --border-hairline: #26221d;
      --border-subtle: #363028;
      --ink-black: #ebe4d8;
      --ink-secondary: #a89f91;
      --ink-muted: #70675b;
      --ink-red: #ef6461;
      --ink-red-soft: rgba(239, 100, 97, 0.14);
      --accent-gold: #c9a050;
      --shadow-page: 0 1px 3px rgba(0, 0, 0, 0.5), 0 16px 40px -8px rgba(0, 0, 0, 0.6);
      --shadow-float: 0 16px 36px rgba(0, 0, 0, 0.7);
    }

    :root {
      --font-serif: 'Noto Serif Ethiopic', 'Abyssinica SIL', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --text-scale: 1.2rem;
      --line-height-body: 2.1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-serif);
      background-color: var(--bg-canvas);
      color: var(--ink-black);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    /* ==========================================================================
       2. MINIMALIST EDITORIAL TOP BAR
       ========================================================================== */
    .topbar {
      height: 54px;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border-hairline);
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--ink-black);
    }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .crumb-bar {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .crumb-book {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--ink-black);
    }
    .crumb-sep {
      color: var(--ink-muted);
      font-family: var(--font-sans);
      font-size: 0.8rem;
    }
    .crumb-chapter {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-red);
    }

    /* Center Mode Switcher */
    .segmented-control {
      display: inline-flex;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      padding: 2px;
      border-radius: 8px;
      gap: 2px;
    }
    .seg-btn {
      padding: 0.28rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .seg-btn:hover {
      color: var(--ink-black);
    }
    .seg-btn.active {
      background: var(--bg-page);
      color: var(--ink-black);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* Right Controls */
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .search-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      padding: 0.3rem 0.65rem 0.3rem 0.7rem;
      border-radius: 7px;
      font-size: 0.82rem;
      color: var(--ink-muted);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .search-trigger:hover {
      border-color: var(--border-subtle);
      color: var(--ink-secondary);
    }
    .search-trigger svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
    }
    .kbd-hint {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      background: var(--bg-page);
      border: 1px solid var(--border-hairline);
      color: var(--ink-muted);
    }

    .text-btn {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--ink-secondary);
      padding: 0.34rem 0.7rem;
      border-radius: 7px;
      border: 1px solid var(--border-hairline);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .text-btn:hover {
      background: var(--bg-hover);
      color: var(--ink-black);
      border-color: var(--border-subtle);
    }

    /* Typography Popover */
    .popover-wrap {
      position: relative;
    }
    .typo-popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 240px;
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.85rem;
      box-shadow: var(--shadow-float);
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 60;
    }
    .typo-popover.open {
      display: flex;
    }
    .pop-label {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      margin-bottom: 0.3rem;
    }
    .theme-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.35rem;
    }
    .swatch-btn {
      padding: 0.4rem 0.25rem;
      border-radius: 6px;
      border: 1px solid var(--border-hairline);
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .swatch-btn.active {
      border-color: var(--ink-red);
      box-shadow: 0 0 0 1px var(--ink-red);
    }
    .size-stepper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }
    .step-size-btn {
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      padding: 0.35rem;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
    }
    .step-size-btn:hover {
      border-color: var(--border-subtle);
    }

    /* ==========================================================================
       3. MAIN WORKSPACE: QUIET LEFT CANON DRAWER + BOOK PAGE
       ========================================================================== */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .nav-drawer {
      width: 280px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: margin-left 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-drawer.closed {
      margin-left: -280px;
    }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.85rem 2rem;
      scrollbar-width: thin;
    }

    .drawer-section-title {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-muted);
      padding: 0 0.5rem;
      margin: 0.9rem 0 0.35rem;
    }
    .drawer-section-title:first-child {
      margin-top: 0;
    }

    .canon-item {
      width: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 7px;
      margin-bottom: 2px;
    }

    .canon-book-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.44rem 0.55rem;
      border-radius: 7px;
      text-align: left;
      cursor: pointer;
      color: var(--ink-secondary);
      font-size: 0.92rem;
      transition: background 0.12s, color 0.12s;
    }
    .canon-book-btn:hover {
      background: var(--bg-hover);
      color: var(--ink-black);
    }
    .canon-book-btn.active {
      background: var(--bg-page);
      color: var(--ink-red);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .canon-book-name {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }
    .canon-ord {
      font-size: 0.76rem;
      color: var(--ink-muted);
      min-width: 1.25rem;
    }
    .canon-book-btn.active .canon-ord {
      color: var(--ink-red);
    }
    .canon-ch-count {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      color: var(--ink-muted);
    }

    /* Inline Chapter Selector Matrix directly inside the active book */
    .inline-chapters-drawer {
      padding: 0.55rem 0.45rem 0.65rem;
      margin: 0.15rem 0 0.35rem;
      background: var(--bg-page);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
    }
    .inline-ch-label {
      font-family: var(--font-sans);
      font-size: 0.67rem;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
    }
    .ch-pills-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }
    .ch-pill {
      padding: 0.28rem 0;
      border-radius: 5px;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: center;
      color: var(--ink-secondary);
      background: var(--bg-canvas);
      cursor: pointer;
      transition: all 0.12s;
    }
    .ch-pill:hover {
      color: var(--ink-red);
      background: var(--ink-red-soft);
    }
    .ch-pill.active {
      background: var(--ink-red);
      color: #ffffff;
    }

    /* ==========================================================================
       4. BOOK FOLIO READING SURFACE (NO UGLY BOXED CARDS)
       ========================================================================== */
    .reader-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem 5rem;
      scroll-behavior: smooth;
    }

    .book-folio {
      max-width: 780px;
      margin: 0 auto;
      background: var(--bg-page);
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      box-shadow: var(--shadow-page);
      padding: 3.25rem 4rem 4rem;
    }

    /* Classical Ethiopian Harag Ornamental Chapter Header */
    .folio-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border-hairline);
    }

    .harag-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: var(--accent-gold);
      margin-bottom: 0.9rem;
      opacity: 0.85;
    }
    .harag-line {
      height: 1px;
      width: 72px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }

    .folio-book-overline {
      font-size: 0.9rem;
      color: var(--ink-muted);
      letter-spacing: 0.03em;
      margin-bottom: 0.25rem;
    }
    .folio-chapter-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--ink-red);
      line-height: 1.25;
      margin-bottom: 0.45rem;
    }
    .folio-incipit {
      font-size: 0.95rem;
      color: var(--ink-secondary);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.65;
    }

    /* Quick Verse Bar inside Folio Header */
    .folio-verse-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 1.15rem;
    }
    .v-dot-btn {
      font-size: 0.78rem;
      color: var(--ink-muted);
      padding: 0.12rem 0.42rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .v-dot-btn:hover {
      color: var(--ink-red);
      background: var(--ink-red-soft);
    }

    /* ==========================================================================
       5. CONTINUOUS BIRANNA MANUSCRIPT VERSES (PURE RED & BLACK INK)
       ========================================================================== */
    .section-rubric-heading {
      color: var(--ink-red);
      font-size: 1.08rem;
      font-weight: 700;
      margin: 1.75rem 0 0.65rem;
      padding-left: 0.75rem;
      border-left: 2px solid var(--accent-gold);
      line-height: 1.5;
    }

    .verse-block {
      position: relative;
      padding: 0.65rem 0.75rem 0.65rem 2.85rem;
      margin: 0 -0.75rem;
      border-radius: 6px;
      transition: background 0.15s ease;
      cursor: pointer;
    }
    .verse-block:hover {
      background: var(--bg-hover);
    }
    .verse-block.selected {
      background: var(--bg-active);
    }

    /* modern-web-guidance: defer-rendering-heavy-content */
    .verse-block.below-fold {
      content-visibility: auto;
      contain-intrinsic-size: auto none auto 130px;
    }

    /* Hanging Margin Ethiopic Verse Numeral */
    .margin-verse-num {
      position: absolute;
      left: 0.55rem;
      top: 0.78rem;
      width: 1.9rem;
      text-align: right;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--ink-red);
      user-select: none;
      line-height: 1.4;
    }
    .margin-verse-num small {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--ink-muted);
    }

    /* Pure Biranna Red & Black Ink Typography — Zero Tacky Pill Boxes */
    .manuscript-flow {
      font-size: var(--text-scale);
      line-height: var(--line-height-body);
      text-align: justify;
      color: var(--ink-black);
    }

    .ink-geez {
      color: var(--ink-red);
      font-weight: 700;
    }
    .ink-sacred {
      color: var(--ink-red);
      font-weight: 600;
    }
    .ink-rubric {
      color: var(--ink-red);
      font-weight: 700;
    }
    .ink-punct {
      color: var(--ink-red);
    }

    /* Inline Expandable Drawer when a Verse is Clicked in Manuscript Mode */
    .verse-inline-drawer {
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-hairline);
      cursor: default;
    }
    .drawer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--ink-muted);
    }
    .drawer-actions {
      display: flex;
      gap: 0.4rem;
    }
    .mini-btn {
      font-family: var(--font-sans);
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--ink-secondary);
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      padding: 0.22rem 0.6rem;
      border-radius: 5px;
      cursor: pointer;
    }
    .mini-btn:hover {
      color: var(--ink-black);
      border-color: var(--ink-black);
    }

    /* ==========================================================================
       6. STRUCTURED STUDY VIEW (ንባብና ትርጓሜ — CLEAN EDITORIAL BREAKDOWN)
       ========================================================================== */
    .study-verse-group {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border-hairline);
    }
    .study-verse-group:last-child {
      border-bottom: none;
    }
    .study-verse-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.85rem;
    }
    .study-verse-ref {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-red);
    }
    .study-verse-ref span {
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 400;
      color: var(--ink-muted);
      margin-left: 0.4rem;
    }

    .study-clause-item {
      padding: 0.75rem 0 0.75rem 1rem;
      border-left: 2px solid var(--border-subtle);
      margin-bottom: 0.75rem;
    }
    .study-clause-item:last-child {
      margin-bottom: 0;
    }
    .study-geez-line {
      font-size: calc(var(--text-scale) * 1.03);
      font-weight: 700;
      color: var(--ink-red);
      line-height: 1.8;
      margin-bottom: 0.35rem;
    }
    .study-amh-line {
      font-size: var(--text-scale);
      line-height: 1.95;
      color: var(--ink-black);
    }
    .study-sub-block {
      margin-top: 0.45rem;
      padding-left: 0.85rem;
      border-left: 2px solid var(--ink-red-soft);
      font-size: calc(var(--text-scale) * 0.95);
      line-height: 1.9;
      color: var(--ink-secondary);
    }

    /* Chapter Footer Navigation */
    .folio-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-chapter-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.1rem;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-black);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-chapter-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--ink-red);
      color: var(--ink-red);
    }
    .nav-chapter-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* ==========================================================================
       7. COMMAND PALETTE SEARCH & DEVELOPER JSON MODAL
       ========================================================================== */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 13, 11, 0.55);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 6vh 1rem 2rem;
      z-index: 100;
    }
    .overlay-backdrop.open {
      display: flex;
    }

    .dialog-card {
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      width: 100%;
      max-width: 680px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-float);
      overflow: hidden;
    }

    .search-input-bar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1.15rem;

    .dialog-body {

      overflow-y: auto;
      padding: 1rem 1.25rem;
    }

    .search-hit {
      padding: 0.75rem;

      border-radius: 6px;
    }

    .json-grid {

      margin-top: 0.75rem;
    }
    .json-dl-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      background: var(--bg-canvas);

      color: var(--ink-black);

      font-weight: 600;

    .json-dl-item:hover {
      border-color: var(--ink-red);

    .json-dl-item small {

      font-size: 0.7rem;
      color: var(--ink-muted);

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translate(-50%, 12px);
      background: var(--ink-black);
      color: var(--bg-page);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 99px;
      box-shadow: var(--shadow-float);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 200;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 860px) {
      .nav-drawer {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 50;
        box-shadow: var(--shadow-float);
      }
      .reader-viewport {
        padding: 0;
      }
      .book-folio {
        border: none;
        border-radius: 0;
        padding: 2rem 1.25rem 3.5rem;
      }

        padding-left: 2.2rem;

        left: 0.15rem;
        width: 1.65rem;
      }

        display: none;

  </style>
</head>
<body>
  <!-- TOP EDITORIAL BAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleDrawer()" title="መጻሕፍትና ምዕራፎች (Books & Chapters)">

      </button>
      <div class="crumb-bar">

    <div class="segmented-control" role="tablist" aria-label="Reading View">

        <span>ፈልግ...</span>
        <span class="kbd-hint">/</span>
      </button>

      <div class="popover-wrap">
        <button class="text-btn" onclick="toggleTypoPopover(event)" title="Typography & Theme">Aa</button>
        <div class="typo-popover" id="typoPopover" onclick="event.stopPropagation()">
          <div>
            <div class="pop-label">የገጽ ቀለም (Theme)</div>

            </div>

  <!-- SEARCH MODAL -->
  <div class="overlay-backdrop" id="searchModal" onclick="if(event.target===this) closeSearchModal()">
    <div class="dialog-card">
      <div class="search-input-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
        <input type="text" id="searchInput" placeholder="ቃል ወይም ሐረግ ይፈልጉ (ለምሳሌ፦ ልደቱ፣ ሥላሴ፣ ዳዊት)..." oninput="performLiveSearch()" />

  <div class="toast" id="toast"></div>

  <script>
    /* ==========================================================================
       13-BOOK CANON CATALOG
       ========================================================================== */
    const BOOKS = [
      { order: 1,  eth: '፩',  key: 'matewes',    file: '01_matewes.json',    dipFile: 'data/extracted/matewes_andemta_complete.json',    cat: '፬ ወንጌላት (Gospels)',         short: 'የማቴዎስ ወንጌል',    full: 'የማቴዎስ ወንጌል አንድምታ',         en: 'Matthew',       chapters: 28, verses: 1070 },
      { order: 2,  eth: '፪',  key: 'markos',     file: '02_markos.json',     dipFile: 'data/extracted/markos_andemta_complete.json',     cat: '፬ ወንጌላት (Gospels)',         short: 'የማርቆስ ወንጌል',    full: 'የማርቆስ ወንጌል አንድምታ',         en: 'Mark',          chapters: 16, verses: 678  },
      { order: 3,  eth: '፫',  key: 'lukas',      file: '03_lukas.json',      dipFile: 'data/extracted/lukas_andemta_complete.json',      cat: '፬ ወንጌላት (Gospels)',         short: 'የሉቃስ ወንጌል',     full: 'የሉቃስ ወንጌል አንድምታ',          en: 'Luke',          chapters: 24, verses: 1146 },
      { order: 4,  eth: '፬',  key: 'yohannes',   file: '04_yohannes.json',   dipFile: 'data/extracted/yohannes_andemta_complete.json',   cat: '፬ ወንጌላት (Gospels)',         short: 'የዮሐንስ ወንጌል',    full: 'የዮሐንስ ወንጌል አንድምታ',         en: 'John',          chapters: 21, verses: 872  },
      { order: 5,  eth: '፭',  key: 'acts',       file: '05_acts.json',       dipFile: 'data/extracted/acts_andemta_complete.json',       cat: 'ታሪክ (Apostolic History)',     short: 'የሐዋርያት ሥራ',     full: 'የሐዋርያት ሥራ አንድምታ',          en: 'Acts',          chapters: 28, verses: 1004 },
      { order: 6,  eth: '፮',  key: 'peter1',     file: '06_peter1.json',     dipFile: 'data/extracted/peter1_andemta_complete.json',     cat: '፯ መልእክታት (Catholic Epistles)', short: '፩ኛ ጴጥሮስ',       full: 'የጴጥሮስ መልእክት ቀዳማዊ አንድምታ',   en: '1 Peter',       chapters: 5,  verses: 106  },
      { order: 7,  eth: '፯',  key: 'peter2',     file: '07_peter2.json',     dipFile: 'data/extracted/peter2_andemta_complete.json',     cat: '፯ መልእክታት (Catholic Epistles)', short: '፪ኛ ጴጥሮስ',       full: 'የጴጥሮስ መልእክት ካልዕ አንድምታ',    en: '2 Peter',       chapters: 3,  verses: 61   },
      { order: 8,  eth: '፰',  key: 'john1',      file: '08_john1.json',      dipFile: 'data/extracted/john1_andemta_complete.json',      cat: '፯ መልእክታት (Catholic Epistles)', short: '፩ኛ ዮሐንስ',       full: 'የዮሐንስ መልእክት ቀዳማዊ አንድምታ',   en: '1 John',        chapters: 5,  verses: 105  },
      { order: 9,  eth: '፱',  key: 'john2',      file: '09_john2.json',      dipFile: 'data/extracted/john2_andemta_complete.json',      cat: '፯ መልእክታት (Catholic Epistles)', short: '፪ኛ ዮሐንስ',       full: 'የዮሐንስ መልእክት ካልዕ አንድምታ',    en: '2 John',        chapters: 1,  verses: 14   },
      { order: 10, eth: '፲',  key: 'john3',      file: '10_john3.json',      dipFile: 'data/extracted/john3_andemta_complete.json',      cat: '፯ መልእክታት (Catholic Epistles)', short: '፫ኛ ዮሐንስ',       full: 'የዮሐንስ መልእክት ሣልስ አንድምታ',    en: '3 John',        chapters: 1,  verses: 16   },
      { order: 11, eth: '፲፩', key: 'james',      file: '11_james.json',      dipFile: 'data/extracted/james_andemta_complete.json',      cat: '፯ መልእክታት (Catholic Epistles)', short: 'የያዕቆብ መልእክት',   full: 'የያዕቆብ መልእክት አንድምታ',        en: 'James',         chapters: 5,  verses: 109  },
      { order: 12, eth: '፲፪', key: 'judah',      file: '12_judah.json',      dipFile: 'data/extracted/judah_andemta_complete.json',      cat: '፯ መልእክታት (Catholic Epistles)', short: 'የይሁዳ መልእክት',    full: 'የይሁዳ መልእክት አንድምታ',         en: 'Jude',          chapters: 1,  verses: 26   },
      { order: 13, eth: '፲፫', key: 'revelation', file: '13_revelation.json', dipFile: 'data/extracted/revelation_andemta_complete.json', cat: 'ራእይ (Apocalypse)',            short: 'የዮሐንስ ራእይ',     full: 'የዮሐንስ ራእይ አንድምታ',          en: 'Revelation',    chapters: 22, verses: 407  }
    ];

    const BOOK_MAP = Object.fromEntries(BOOKS.map(b => [b.key, b]));
    const CACHE = {};

    let ACTIVE_BOOK = 'matewes';
    let ACTIVE_CHAPTER = 1;
    let ACTIVE_VERSE = null;
    let VIEW_MODE = 'manuscript'; // 'manuscript' | 'study'
    let BOOK_DATA = null;
    let FONT_REM = 1.2;

    function esc(s) {
      return (s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._tTimer);
      window._tTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function toggleDrawer() {
      document.getElementById('navDrawer').classList.toggle('closed');
    }

    function toggleTypoPopover(e) {
      e.stopPropagation();
      document.getElementById('typoPopover').classList.toggle('open');
    }

    document.addEventListener('click', () => {
      document.getElementById('typoPopover').classList.remove('open');
    });

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      ['parchment', 'paper', 'night'].forEach(t => {
        document.getElementById('swatch-' + t).classList.toggle('active', t === theme);
      });
      localStorage.setItem('andemta_theme_v2', theme);
    }

    function stepFontSize(delta) {
      FONT_REM = Math.max(0.96, Math.min(1.6, +(FONT_REM + delta).toFixed(2)));
      document.documentElement.style.setProperty('--text-scale', FONT_REM + 'rem');
    }

    function setViewMode(mode) {
      VIEW_MODE = mode;
      document.getElementById('view-manuscript').classList.toggle('active', mode === 'manuscript');
      document.getElementById('view-study').classList.toggle('active', mode === 'study');
      renderFolio();
    }

    /* ==========================================================================
       SIDEBAR RENDERER (CATEGORIZED BOOKS + INLINE CHAPTER MATRIX)
       ========================================================================== */
    function renderSidebar() {
      const container = document.getElementById('drawerScroll');
      const categories = [];
      BOOKS.forEach(b => {
        if (!categories.includes(b.cat)) categories.push(b.cat);
      });

      let html = '';
      categories.forEach(cat => {
        html += `<div class="drawer-section-title">${esc(cat)}</div>`;
        BOOKS.filter(b => b.cat === cat).forEach(b => {
          const isCurrent = b.key === ACTIVE_BOOK;
          html += `<div class="canon-item">`;
          html += `
            <button class="canon-book-btn${isCurrent ? ' active' : ''}" onclick="loadBook('${b.key}', 1)">
              <span class="canon-book-name">
                <span class="canon-ord">${b.eth}.</span>
                <span>${esc(b.short)}</span>
              </span>
              <span class="canon-ch-count">${b.chapters} ምዕራፍ</span>
            </button>
          `;
          if (isCurrent && BOOK_DATA) {
            const chapters = BOOK_DATA.chapters || [];
            const pills = chapters.map(ch => `
              <button class="ch-pill${ch.chapter_num === ACTIVE_CHAPTER ? ' active' : ''}"
                      onclick="selectChapter(${ch.chapter_num})"
                      title="ምዕራፍ ${ch.chapter_ethiopic} (${ch.chapter_num})">
                ${esc(ch.chapter_ethiopic)}
              </button>
            `).join('');
            html += `
              <div class="inline-chapters-drawer">
                <div class="inline-ch-label">
                  <span>ምዕራፍ ይምረጡ (Select Chapter)</span>
                  <span>1–${chapters.length}</span>
                </div>
                <div class="ch-pills-grid">${pills}</div>
              </div>
            `;
          }
          html += `</div>`;
        });
      });

      container.innerHTML = html;
    }

    /* ==========================================================================
       UNIVERSAL BOOK FETCHER (Static GitHub Pages + Local Server)
       ========================================================================== */
    async function fetchBook(bookKey) {
      if (CACHE[bookKey]) return CACHE[bookKey];
      const meta = BOOK_MAP[bookKey];
      const candidates = [
        `./${meta.file}`,
        `./${meta.dipFile}`,
        `/api/book?book=${encodeURIComponent(bookKey)}`
      ];
      for (const url of candidates) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            CACHE[bookKey] = data;
            return data;
          }
        } catch (_) {}
      }
      throw new Error('Failed to load ' + bookKey);
    }

    async function loadBook(bookKey, chapterNum = 1, verseNum = null) {
      if (!BOOK_MAP[bookKey]) bookKey = 'matewes';
      ACTIVE_BOOK = bookKey;
      ACTIVE_CHAPTER = chapterNum || 1;
      ACTIVE_VERSE = verseNum;

      const meta = BOOK_MAP[bookKey];
      document.getElementById('crumbBook').textContent = meta.full;

      if (!CACHE[bookKey]) {
        document.getElementById('bookFolio').innerHTML = `
          <div style="text-align:center; padding:4.5rem 1rem; color:var(--ink-muted);">
            ${esc(meta.full)} በመጫን ላይ...
          </div>
        `;
      }

      BOOK_DATA = await fetchBook(bookKey);
      const maxCh = (BOOK_DATA.chapters || []).length || 1;
      ACTIVE_CHAPTER = Math.max(1, Math.min(maxCh, ACTIVE_CHAPTER));

      renderSidebar();
      renderFolio();

      if (verseNum !== null) {
        setTimeout(() => jumpToVerse(verseNum), 50);
      } else {
        document.getElementById('readerViewport').scrollTop = 0;
      }

      syncUrlHash();
      if (window.innerWidth <= 860) {
        document.getElementById('navDrawer').classList.add('closed');
      }
    }

    function selectChapter(chNum, verseNum = null) {
      ACTIVE_CHAPTER = chNum;
      ACTIVE_VERSE = verseNum;
      renderSidebar();
      renderFolio();
      if (verseNum !== null) {
        setTimeout(() => jumpToVerse(verseNum), 50);
      } else {
        document.getElementById('readerViewport').scrollTop = 0;
      }
      syncUrlHash();
      if (window.innerWidth <= 860) {
        document.getElementById('navDrawer').classList.add('closed');
      }
    }

    function syncUrlHash() {
      const h = ACTIVE_VERSE !== null
        ? `#${ACTIVE_BOOK}:${ACTIVE_CHAPTER}:${ACTIVE_VERSE}`
        : `#${ACTIVE_BOOK}:${ACTIVE_CHAPTER}`;
      history.replaceState(null, '', h);
    }

    /* ==========================================================================
       BIRANNA RED & BLACK INK RENDERER (ZERO TACKY INLINE PILLS)
       ========================================================================== */
    function renderBirannaSpans(spans) {
      if (!spans || !spans.length) return '';
      return spans.map(sp => {
        const text = esc(sp.text);
        const cat = sp.category;
        if (cat === 'geez_scripture') {
          return `<span class="ink-geez">${text}</span>`;
        }
        if (cat === 'sacred_divine_name' || cat === 'sacred_mariology' || cat === 'sacred_saint_angel') {
          return `<span class="ink-sacred">${text}</span>`;
        }
        if (cat === 'andemta_rubric') {
          return `<span class="ink-rubric">${text}</span>`;
        }
        if (cat === 'rubric_numeral_punct') {
          return `<span class="ink-punct">${text}</span>`;
        }
        return text;
      }).join('');
    }

    function rubricatePlainAmharic(text) {
      return esc(text || '')
        .replace(/(?<![ሀ-ፚ])(አንድም|\(?(?:ሐተታ|ታሪክ|ምሳሌ|ትንቢት|ጥቅስ)\)?)(?![ሀ-ፚ])/g, '<span class="ink-rubric">$1</span>')
        .replace(/([፩-፼]+|።|፠)/g, '<span class="ink-punct">$1</span>');
    }

    /* ==========================================================================
       FOLIO PAGE RENDERER (MANUSCRIPT VIEW & STRUCTURED STUDY VIEW)
       ========================================================================== */
    function renderFolio() {
      if (!BOOK_DATA) return;
      const chapters = BOOK_DATA.chapters || [];
      const ch = chapters.find(c => c.chapter_num === ACTIVE_CHAPTER) || chapters[0];
      if (!ch) return;

      const meta = BOOK_MAP[ACTIVE_BOOK];
      document.getElementById('crumbBook').textContent = meta.full;
      document.getElementById('crumbChapter').textContent = `ምዕራፍ ${ch.chapter_ethiopic} (${ch.chapter_num})`;

      const verses = ch.verses || [];
      const verseDots = verses.map(v => {
        const lbl = v.is_prologue ? 'መቅድም' : v.verse_ethiopic;
        return `<button class="v-dot-btn" onclick="jumpToVerse(${v.verse_num})" title="ቍጥር ${v.verse_ethiopic} (${v.verse_num})">${esc(lbl)}</button>`;
      }).join('');

      let bodyHtml = '';

      if (VIEW_MODE === 'manuscript') {
        bodyHtml = verses.map((v, idx) => {
          const belowFold = idx > 8 ? ' below-fold' : '';
          const isSelected = ACTIVE_VERSE === v.verse_num;
          const secHeading = v.section_title
            ? `<div class="section-rubric-heading">${esc(v.section_title)}</div>`
            : '';
          const numDisplay = v.is_prologue
            ? `<span style="font-size:0.75rem;">መቅ</span>`
            : `${esc(v.verse_ethiopic)}<small>${v.verse_num}</small>`;

          let expandedHtml = '';
          if (isSelected) {
            const clauses = (v.clause_by_clause || []).map(c => `
              <div class="study-clause-item">
                ${c.geez_lemma ? `<div class="study-geez-line">${esc(c.geez_lemma)}</div>` : ''}
                ${c.primary_interpretation ? `<div class="study-amh-line">${rubricatePlainAmharic(c.primary_interpretation)}</div>` : ''}
                ${(c.andem_interpretations || []).map(a => `<div class="study-sub-block">${rubricatePlainAmharic(a)}</div>`).join('')}
                ${(c.hateta_explanations || []).map(h => `<div class="study-sub-block">${rubricatePlainAmharic(h)}</div>`).join('')}
              </div>
            `).join('');

            expandedHtml = `
              <div class="verse-inline-drawer" onclick="event.stopPropagation()">
                <div class="drawer-toolbar">
                  <span>${esc(v.reference_geez)} · ${esc(v.reference_english)} · ገጽ ${esc(v.start_book_page_ethiopic || '-')}</span>
                  <div class="drawer-actions">
                    <button class="mini-btn" onclick="copyVerseText(${v.verse_num})">ቅዳ (Copy)</button>
                    <button class="mini-btn" onclick="showVerseJson(${v.verse_num})">JSON</button>
                  </div>
                </div>
                ${clauses}
              </div>
            `;
          }

          return `
            ${secHeading}
            <div class="verse-block${belowFold}${isSelected ? ' selected' : ''}"
                 id="v-${v.verse_num}"
                 onclick="toggleSelectVerse(${v.verse_num})">
              <div class="margin-verse-num">${numDisplay}</div>
              <div class="manuscript-flow">${renderBirannaSpans(v.biranna_spans)}</div>
              ${expandedHtml}
            </div>
          `;
        }).join('');
      } else {
        /* Structured Study View (ንባብና ትርጓሜ) */
        bodyHtml = verses.map((v, idx) => {
          const belowFold = idx > 6 ? ' below-fold' : '';
          const secHeading = v.section_title
            ? `<div class="section-rubric-heading">${esc(v.section_title)}</div>`
            : '';
          const refLabel = v.is_prologue
            ? 'መቅድም (Prologue)'
            : `ቍጥር ${v.verse_ethiopic} <span>${esc(v.reference_english)} · ገጽ ${esc(v.start_book_page_ethiopic || '-')}</span>`;

          const clausesHtml = (v.clause_by_clause || []).map(c => `
            <div class="study-clause-item">
              ${c.geez_lemma ? `<div class="study-geez-line">${esc(c.geez_lemma)}</div>` : ''}
              ${c.primary_interpretation ? `<div class="study-amh-line">${rubricatePlainAmharic(c.primary_interpretation)}</div>` : ''}
              ${(c.andem_interpretations || []).map(a => `<div class="study-sub-block">${rubricatePlainAmharic(a)}</div>`).join('')}
              ${(c.hateta_explanations || []).map(h => `<div class="study-sub-block">${rubricatePlainAmharic(h)}</div>`).join('')}
            </div>
          `).join('');

          return `
            ${secHeading}
            <section class="study-verse-group${belowFold}" id="v-${v.verse_num}">
              <div class="study-verse-head">
                <div class="study-verse-ref">${refLabel}</div>
                <div class="drawer-actions">
                  <button class="mini-btn" onclick="copyVerseText(${v.verse_num})">ቅዳ</button>
                  <button class="mini-btn" onclick="showVerseJson(${v.verse_num})">JSON</button>
                </div>
              </div>
              ${clausesHtml}
            </section>
          `;
        }).join('');
      }

      const folio = document.getElementById('bookFolio');
      folio.innerHTML = `
        <header class="folio-header">
          <div class="harag-ornament">
            <span class="harag-line"></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M12 2v20M2 12h20M7 7l10 10M17 7L7 17"/>
            </svg>
            <span class="harag-line"></span>
          </div>
          <div class="folio-book-overline">${esc(BOOK_DATA.title_geez)} · ${esc(meta.en)}</div>
          <h1 class="folio-chapter-title">ምዕራፍ ${esc(ch.chapter_ethiopic)}</h1>
          <p class="folio-incipit">${esc(ch.geez_incipit || '')}</p>
          <div class="folio-verse-bar">${verseDots}</div>
        </header>

        <div>${bodyHtml}</div>

        <footer class="folio-footer">
          <button class="nav-chapter-btn" onclick="selectChapter(${ACTIVE_CHAPTER - 1})" ${ACTIVE_CHAPTER <= 1 ? 'disabled' : ''}>
            ← ቀዳሚ ምዕራፍ
          </button>
          <span style="font-family:var(--font-sans); font-size:0.78rem; color:var(--ink-muted);">
            ምዕራፍ ${ch.chapter_num} / ${chapters.length}
          </span>
          <button class="nav-chapter-btn" onclick="selectChapter(${ACTIVE_CHAPTER + 1})" ${ACTIVE_CHAPTER >= chapters.length ? 'disabled' : ''}>
            ቀጣይ ምዕራፍ →
          </button>
        </footer>
      `;
    }

    function toggleSelectVerse(vNum) {
      ACTIVE_VERSE = (ACTIVE_VERSE === vNum) ? null : vNum;
      renderFolio();
      syncUrlHash();
    }

    function jumpToVerse(vNum) {
      ACTIVE_VERSE = vNum;
      renderFolio();
      const el = document.getElementById('v-' + vNum);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      syncUrlHash();
    }

    function copyVerseText(vNum) {
      const ch = (BOOK_DATA.chapters || []).find(c => c.chapter_num === ACTIVE_CHAPTER);
      const v = ch && (ch.verses || []).find(x => x.verse_num === vNum);
      if (!v) return;
      const out = `${BOOK_DATA.title_geez} — ${v.reference_geez} (${v.reference_english})\n${v.rejoined_plain_text}`;
      navigator.clipboard.writeText(out);
      toast(`${v.reference_short_geez || v.reference_english} ተቀድቷል`);
    }

    /* ==========================================================================
       SEARCH MODAL & OPEN-SOURCE DATA / JSON MODAL
       ========================================================================== */
    function openSearchModal() {
      document.getElementById('searchModal').classList.add('open');
      setTimeout(() => document.getElementById('searchInput').focus(), 40);
    }

    function closeSearchModal() {
      document.getElementById('searchModal').classList.remove('open');
    }

    function performLiveSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const body = document.getElementById('searchResultsBody');
      if (!q || !BOOK_DATA) {
        body.innerHTML = `<p style="color:var(--ink-muted); font-size:0.88rem; text-align:center; padding:2rem 0;">በ${esc(BOOK_DATA ? BOOK_DATA.title_geez : 'መጽሐፉ')} ውስጥ ለመፈለግ ከላይ ይጻፉ...</p>`;
        return;
      }

      const hits = [];
      for (const ch of (BOOK_DATA.chapters || [])) {
        for (const v of (ch.verses || [])) {
          const hay = v.rejoined_plain_text || '';
          const idx = hay.indexOf(q);
          if (idx !== -1) {
            const start = Math.max(0, idx - 55);
            const end = Math.min(hay.length, idx + q.length + 85);
            const snippet = (start > 0 ? '…' : '') + hay.slice(start, end) + (end < hay.length ? '…' : '');
            hits.push({ chNum: ch.chapter_num, chEth: ch.chapter_ethiopic, vNum: v.verse_num, vEth: v.verse_ethiopic, refEn: v.reference_english, snippet });
            if (hits.length >= 60) break;
          }
        }
        if (hits.length >= 60) break;
      }

      if (!hits.length) {
        body.innerHTML = `<p style="color:var(--ink-muted); text-align:center; padding:2rem 0;">ለ«${esc(q)}» ምንም ውጤት አልተገኘም።</p>`;
        return;
      }

      const safeRe = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      body.innerHTML = hits.map(h => {
        const hi = esc(h.snippet).replace(safeRe, `<mark style="background:var(--ink-red-soft); color:var(--ink-red); font-weight:700; padding:0 2px; border-radius:2px;">${esc(q)}</mark>`);
        return `
          <div class="search-hit" onclick="closeSearchModal(); selectChapter(${h.chNum}, ${h.vNum});">
            <div class="search-hit-ref">ምዕራፍ ${esc(h.chEth)} ፥ ቍጥር ${esc(h.vEth)} (${esc(h.refEn || '')})</div>
            <div class="search-hit-snippet">${hi}</div>
          </div>
        `;
      }).join('');
    }

    function openDataModal() {
      const body = document.getElementById('dataModalBody');
      const items = BOOKS.map(b => `
        <a class="json-dl-item" href="./${b.file}" download="${b.file}">
          <span>${b.eth}. ${esc(b.short)}</span>
          <small>${b.file}</small>
        </a>
      `).join('');

      body.innerHTML = `
        <p style="font-family:var(--font-sans); font-size:0.84rem; color:var(--ink-secondary); line-height:1.6; margin-bottom:0.85rem;">
          All 13 books are published as self-contained, technology-agnostic JSON files with pre-tokenized Biranna red/black spans (<code>biranna_spans</code>) and structured clause-by-clause exegesis (<code>clause_by_clause</code>).
        </p>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;">
          <a class="text-btn" style="background:var(--ink-red); color:#fff; border-color:var(--ink-red);" href="./00_all_13_books_complete.json" download>Download Complete 13-Book JSON (48 MB)</a>
          <a class="text-btn" href="./schema.json" target="_blank">JSON Schema (schema.json)</a>
          <a class="text-btn" href="https://github.com/SenayGebre/ethiopian-orthodox-andemta" target="_blank">GitHub Repository</a>
        </div>
        <div class="pop-label">Individual Book JSON Files</div>
        <div class="json-grid">${items}</div>
      `;
      document.getElementById('dataModal').classList.add('open');
    }

    function closeDataModal() {
      document.getElementById('dataModal').classList.remove('open');
    }

    function showVerseJson(vNum) {
      const ch = (BOOK_DATA.chapters || []).find(c => c.chapter_num === ACTIVE_CHAPTER);
      const v = ch && (ch.verses || []).find(x => x.verse_num === vNum);
      if (!v) return;
      const body = document.getElementById('dataModalBody');
      body.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.65rem;">
          <strong style="color:var(--ink-red);">${esc(v.id)} — ${esc(v.reference_geez)}</strong>
          <button class="mini-btn" onclick="navigator.clipboard.writeText(document.getElementById('rawVersePre').textContent); toast('JSON copied!');">Copy JSON</button>
        </div>
        <pre id="rawVersePre" style="background:var(--bg-canvas); padding:0.9rem; border-radius:8px; overflow:auto; font-family:ui-monospace, monospace; font-size:0.78rem; line-height:1.55;">${esc(JSON.stringify(v, null, 2))}</pre>
      `;
      document.getElementById('dataModal').classList.add('open');
    }

    window.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        openSearchModal();
      } else if (e.key === 'Escape') {
        closeSearchModal();
        closeDataModal();
      }
    });

    (function init() {
      const savedTheme = localStorage.getItem('andemta_theme_v2') || 'parchment';
      setTheme(savedTheme);
      const rawHash = (window.location.hash || '').replace(/^#/, '').trim();
      const parts = rawHash.split(':');
      const bKey = BOOK_MAP[parts[0]] ? parts[0] : 'matewes';
      const chNum = parseInt(parts[1] || '1', 10) || 1;
      const vNum = parts[2] !== undefined ? parseInt(parts[2], 10) : null;
      loadBook(bKey, chNum, vNum);
    })();
  </script>
</body>
</html>
